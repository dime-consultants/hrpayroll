version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hr_payroll_dev
      POSTGRES_USER: hr_dev
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_dev -d hr_payroll_dev"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - /app/logs/
    ports:
      - "8000:8000"
    env_file: .env.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: celery -A hr_payroll worker --loglevel=debug --concurrency=2 -Q celery,repayments,uploads
    volumes:
      - .:/app
    env_file: .env.dev
    depends_on:
      - db
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: celery -A hr_payroll beat --loglevel=debug --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file: .env.dev
    depends_on:
      - db
      - redis

  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: celery -A hr_payroll flower --port=5555
    ports:
      - "5555:5555"
    env_file: .env.dev
    depends_on:
      - redis

volumes:
  dev_postgres_data:
