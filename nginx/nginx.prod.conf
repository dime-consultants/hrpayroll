user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    upstream django {
        least_conn;
        server web:8080 fail_timeout=10s max_fails=3;
        keepalive 32;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name hr.dimeapp.co.ke;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;                 # Removed http2 to silence deprecation warning
        server_name hr.dimeapp.co.ke;

        ssl_certificate /etc/nginx/certs/live/hr.dimeapp.co.ke/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/hr.dimeapp.co.ke/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        client_max_body_size 12M;
        limit_conn conn 20;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://django;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /admin/ {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://django;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://django;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/uploads/ {
            limit_req zone=upload burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://django;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/health/ {
            proxy_pass http://django;
            include /etc/nginx/conf.d/proxy_params.conf;
            access_log off;
        }
    }
}