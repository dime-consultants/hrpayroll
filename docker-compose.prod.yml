version: '3.9'

x-app-env: &app-env
  env_file: .env.prod
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-hr_payroll}
      POSTGRES_USER: ${DB_USER:-hr_payroll_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hr_payroll_user} -d ${DB_NAME:-hr_payroll}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    restart: unless-stopped
    <<: *app-env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn hr_payroll.wsgi:application
               --bind 0.0.0.0:8000
               --workers 4
               --timeout 120
               --keep-alive 5
               --max-requests 1000
               --max-requests-jitter 100
               --access-logfile -
               --error-logfile -"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    expose:
      - "8000"
    networks:
      - internal
      - external

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    restart: unless-stopped
    <<: *app-env
    command: >
      celery -A hr_payroll worker
        --loglevel=info
        --concurrency=4
        --prefetch-multiplier=1
        --max-tasks-per-child=100
        -Q celery,repayments,uploads
    volumes:
      - logs_volume:/app/logs
    networks:
      - internal

  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    restart: unless-stopped
    <<: *app-env
    command: >
      celery -A hr_payroll beat
        --loglevel=info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - logs_volume:/app/logs
    networks:
      - internal

  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    restart: unless-stopped
    <<: *app-env
    command: >
      celery -A hr_payroll flower
        --port=5555
        --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    expose:
      - "5555"
    networks:
      - internal
      - external

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    networks:
      - external
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:

networks:
  internal:
    internal: true
  external:
