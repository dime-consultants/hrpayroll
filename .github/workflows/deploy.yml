name: Build Image & Trigger Deployment

on:
  push:
    branches:
      - master
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Collect static files
        run: |
          python manage.py collectstatic --noinput --clear

      - name: Run tests
        run: |
          python manage.py test

  build-and-trigger:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Validate that Docker Hub secrets exist.
      # Do NOT print the actual values.
      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Error: DOCKERHUB_USERNAME is missing."
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Error: DOCKERHUB_TOKEN is missing."
            exit 1
          fi

          echo "Docker Hub credentials are configured."

      # Using password-stdin instead of docker/login-action
      # because of the malformed HTTP Authorization header issue.
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | \
            docker login docker.io \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

      - name: Determine environment
        id: env
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master" ]]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=stage" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Docker image tag
        id: tag
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE_NAME="ai_invoicing"
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          ENV_NAME="${{ steps.env.outputs.env }}"

          IMAGE_TAG="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${ENV_NAME}-${TIMESTAMP}"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"

          echo "Generated Docker image tag: $IMAGE_TAG"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.image_tag }}
          platforms: linux/amd64,linux/arm64/v8

      - name: Encode docker-compose file
        id: compose
        shell: bash
        run: |
          if [ ! -f docker-compose.yml ]; then
            echo "Error: docker-compose.yml not found in repository."
            exit 1
          fi

          COMPOSE_B64=$(base64 -w 0 docker-compose.yml)

          echo "b64=$COMPOSE_B64" >> "$GITHUB_OUTPUT"

      - name: Prepare env_secrets payload
        id: prepare_secrets
        shell: bash
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          JSON="{}"

          if [ -n "$DJANGO_SECRET_KEY" ]; then
            JSON=$(echo "$JSON" | jq \
              --arg key "DJANGO_SECRET_KEY" \
              --arg value "$DJANGO_SECRET_KEY" \
              '.[$key] = $value')
          fi

          if [[ "${{ steps.env.outputs.env }}" == "stage" ]]; then
            SYSTEM_BASE_URL="stage-invoicing.dimeconsultants.africa"
          else
            SYSTEM_BASE_URL="invoicing.dimeconsultants.africa"
          fi

          JSON=$(echo "$JSON" | jq \
            --arg key "SYSTEM_BASE_URL" \
            --arg value "$SYSTEM_BASE_URL" \
            '.[$key] = $value')

          COMPACT=$(echo "$JSON" | jq -c '.')

          {
            echo "secrets_json<<EOF"
            echo "$COMPACT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare deployment payload
        id: payload
        shell: bash
        env:
          APP_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ENV_NAME: ${{ steps.env.outputs.env }}
          SHA: ${{ github.sha }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          DOCKER_COMPOSE_B64: ${{ steps.compose.outputs.b64 }}
          ENV_SECRETS_JSON: ${{ steps.prepare_secrets.outputs.secrets_json }}
        run: |
          PAYLOAD=$(jq -nc \
            --arg app_repo "$APP_REPO" \
            --arg branch "$BRANCH" \
            --arg env "$ENV_NAME" \
            --arg sha "$SHA" \
            --arg image_tag "$IMAGE_TAG" \
            --arg docker_compose_b64 "$DOCKER_COMPOSE_B64" \
            --argjson env_secrets "$ENV_SECRETS_JSON" \
            '{
              app_repo: $app_repo,
              branch: $branch,
              env: $env,
              sha: $sha,
              image_tag: $image_tag,
              docker_compose_b64: $docker_compose_b64,
              env_secrets: $env_secrets
            }')

          {
            echo "client_payload<<EOF"
            echo "$PAYLOAD"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Infra PAT
        env:
          INFRA_PAT: ${{ secrets.INFRA_PAT }}
        run: |
          if [ -z "$INFRA_PAT" ]; then
            echo "Error: INFRA_PAT is missing."
            exit 1
          fi
          echo "Infra PAT is configured."

      - name: Trigger deployment in Infra repository
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.INFRA_PAT }}
          repository: dime-consultants/infrastructure
          event-type: deploy-app
          client-payload: ${{ steps.payload.outputs.client_payload }}
