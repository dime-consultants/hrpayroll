version: '3.9'

x-app-env: &app-env
  env_file: .env.prod
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ── PostgreSQL ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_payroll_user -d hr_payroll"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env.prod
    command: >
      sh -c 'redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Django / Gunicorn ─────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    restart: unless-stopped
    <<: *app-env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    expose:
      - "8080"
    networks:
      - internal
      - external

  # ── Celery Worker ─────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    restart: unless-stopped
    <<: *app-env
    command: celery -A hr_payroll worker --loglevel=info --concurrency=4 --prefetch-multiplier=1 --max-tasks-per-child=100 -Q celery,repayments,uploads
    volumes:
      - .:/app
      - logs_volume:/app/logs
    networks:
      - internal

  # ── Celery Beat ───────────────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    restart: unless-stopped
    <<: *app-env
    command: celery -A hr_payroll beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
      - logs_volume:/app/logs
    networks:
      - internal

  # ── Flower ────────────────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    restart: unless-stopped
    <<: *app-env
    command: sh -c 'celery -A hr_payroll flower --port=5555 --basic_auth="$$FLOWER_USER:$$FLOWER_PASSWORD"'
    expose:
      - "5555"
    networks:
      - internal
      - external

  # ── Nginx ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "7070:80"
      - "9443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /var/www/certbot:/var/www/certbot:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    networks:
      - external
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:

networks:
  internal:
    internal: true
  external: